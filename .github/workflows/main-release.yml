name: Main Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  make-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # build steps here if needed

      - name: Create selective zip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p out
          printf '%s\n' "${TAG}" > SKSE/Plugins/MARAS/version.txt
          # Exclude non-English packs & DSD from the main archive so DSD never leaks into English setups
          zip -r "out/MARAS_${TAG}.zip" \
            interface/ \
            Magelight/ \
            Scripts/ \
            SKSE/ \
            Seq/ \
            sound/ \
            Strings/ \
            TT_MARAS.esp \
            *.ini \
            -x ".github/*" \
            -x "*.pdb" \
            -x "SKSE/Plugins/DynamicStringDistributor*" \
            -x "SKSE/Plugins/MARAS/localization/*"
          zip -r "out/MARAS_${TAG}.zip" \
            SKSE/Plugins/MARAS/localization/en/ \
            -x "*_todo.json" -x "*.todo.json"

      - name: Build Translations FOMOD zip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 localization/scripts/package_translations_fomod.py \
            --version "${TAG}" \
            --output "out/MARAS_Translations_${TAG}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: "Automated release for ${{ github.ref_name }}"
          files: |
            out/MARAS_${{ github.ref_name }}.zip
            out/MARAS_Translations_${{ github.ref_name }}.zip
