; ====================================================================
; M.A.R.A.S NPC Index Overrides Configuration
; ====================================================================
; This file allows force-including or excluding specific NPCs from the
; centralized M.A.R.A.S NPC Index, as well as customizing name,
; EditorID, and plugin filtering rules.
;
; Supported identifier formats:
;   - PluginName.esp|0xLocalFormID   (e.g., Skyrim.esm|0x0A2C94)
;   - Direct Hex FormID             (e.g., 0x000A2C94)
;   - EditorID                      (e.g., MQ101Braith)
;
; Wildcard syntax:
;   - Exact string without '*' or '?' matches exactly (e.g. Gallus, Miner)
;   - Pattern with '*' matches zero or more characters (e.g. MQ304*, bandit*, *Soldier*)
;   - Pattern with '?' matches any single character
;
; Lines starting with ; or # are comments.
; ====================================================================

[Include]
; Force-include NPCs that might not be marked unique in their plugin record
; Example:
; Skyrim.esm|0x0A2C94
; InterestingNPCs.esp|0x012345
; MQ101Braith

[Exclude]
; Force-exclude specific NPCs by FormID or EditorID
; Example:
; Skyrim.esm|0x013BA9

[ExcludeNames]
; NPCs whose display name matches these exact names or wildcard patterns (case-insensitive)
; are excluded unless explicitly in [Include].
; Remove or add lines as needed.
; Exact Names:
; Stormcloak Soldier
; Imperial Soldier
; Whiterun Guard
; Wildcard Name Patterns:


