# ==============================================================================
# M.A.R.A.S — Child Training & Adult Progression Configuration
# ==============================================================================
# This file defines the adolescent training locations/classes and passive Daedric
# Champion Lineage blessings for grown-up children (Stage 3 -> Stage 4).
#
# HOW TO EXTEND OR OVERRIDE (MODDER DROP-INS):
#   Drop additional .yaml files into:
#     Data/SKSE/Plugins/MARAS/childTraining/
#   - If an entry's `id` matches an existing entry below, any fields you specify
#     will patch/override that entry in-place while preserving its index.
#   - If an entry's `id` is new, it will be appended as a brand-new training path
#     and automatically appear in the UI Dashboard!
#
# FORM KEY SYNTAX:
#   "__formData|<PluginName>|<0xHexFormID>"
#   Supports both standard 24-bit plugins (.esm/.esp) and 12-bit light plugins (.esl).
#   If a plugin is not installed in the player's load order, missing spells/items
#   are safely skipped, and combatStyle/outfit arrays fall back to the next entry.
#
# AI MORALITY & CONFIDENCE VALUES:
#   morality      : -1 = Inherit from Custodial Guardians, 0 = Any Crime,
#                    1 = Violence Against Enemies, 2 = Property Crime Only, 3 = No Crime
#   minConfidence : 1 = Cautious, 2 = Average, 3 = Brave, 4 = Foolhardy
#
# PARENT AFFILIATION DISCOUNTS (`affiliation:`):
#   If at least one of the child's parents/guardians belongs to the training group:
#   - Member (memberFactions / memberQuests / memberWerewolf): 10% tuition discount
#   - Leader (leaderFactions / leaderFactionRank / leaderQuests / leaderNpcs): 25% tuition discount
#
# SKILL WEIGHTS (`skills:` in trainingLocations):
#   Use Creation Kit-style integer weights from 1 to 5:
#     5 = Primary signature skill (scales +25 at Player Lv 10 -> +80 at Player Lv 50+)
#     4 = Secondary core skill    (scales +20 at Player Lv 10 -> +64 at Player Lv 50+)
#     3 = Tertiary combat skill   (scales +15 at Player Lv 10 -> +48 at Player Lv 50+)
#     2 = Minor support skill     (scales +10 at Player Lv 10 -> +32 at Player Lv 50+)
#     1 = Utility/Flavor skill    (scales +5  at Player Lv 10 -> +16 at Player Lv 50+)
#
# PERK PROGRESSION (`perks:` in trainingLocations):
#   List all perks (and ranks) available to the training path. At runtime, M.A.R.A.S
#   reads each perk's skill/level requirement directly from the BGSPerk record, grants
#   only the perks whose requirement the child currently meets, and automatically
#   unlocks/upgrades higher ranks (`nextPerk`) as the child levels up (Lv 10 -> Lv 50).
#
# SKYRIMNET CONTEXT (`skyrimnetContext:` in trainingLocations):
#   In-world infinitive clause ("to ...") capturing the institution's setting,
#   atmosphere, daily regimen/culture, and training discipline (beyond bare skills).
#   Used in SkyrimNet training departure events and Stage 4 adult biography generation
#   instead of the longer UI card `description`.
# ==============================================================================

