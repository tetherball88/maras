# customCategory: TTM_CategoryRelationship
name: RevealChildSecret
description: "{{render_template(\"maras_actions/maras_action_reveal_child_secret\")}}"
questEditorId: TTM_MainController
scriptName: TTM_Actions
executionFunctionName: RevealChildSecret
parameterMapping:
  - type: speaker
    name: akActor
    description: Speaker Actor parameter (triggering entity, mother revealing secret)
  - type: dynamic
    name: targetFather
    description: Display name of the father to reveal to, or 'Both' if revealing to both fathers present.
    useNearbyActors: false
  - type: dynamic
    name: childName
    description: Display name of the child (or 'all' for unborn pregnancy) whose secret is being revealed.
    useNearbyActors: false
  - type: dynamic
    name: revealMode
    description: "'pregnancy_only' if announcing the pregnancy to her partner while letting him believe the baby is his (hiding the true father); 'true_paternity' if confessing the true biological father."
    useNearbyActors: false
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: ttm_get_reveal_child_secret_candidates
        arguments:
          - currentActor
        comparisonOperator: "!="
        expectedValue: ""
