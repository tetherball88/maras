name: "ttm_paternity_secret_resolved"
description: "Direct narration when a child's true paternity is discovered or confessed in MARAS"

eventCriteria:
  eventType: "ttm_event"
  schemaConditions:
    - fieldPath: "type"
      operator: "equals"
      value: "ttm_paternity_secret_resolved"
      caseSensitive: false
    - fieldPath: "skipTrigger"
      operator: "equals"
      value: false

audience: "nearby_npcs"
response:
  type: "direct_narration"
  content: "Have {{originator}} and the involved parties address the truth about {{event_json.child}}'s biological paternity in a way that fits their personalities and relationships."

enabled: true
interrupt: true
probability: 1
cooldownSeconds: 30
priority: 9
