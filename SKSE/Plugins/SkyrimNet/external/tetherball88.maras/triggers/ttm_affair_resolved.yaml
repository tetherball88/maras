name: "ttm_affair_resolved"
description: "Direct narration when an exposed affair reaches confrontation, forgiveness, or breakup in MARAS"

eventCriteria:
  eventType: "ttm_event"
  schemaConditions:
    - fieldPath: "type"
      operator: "equals"
      value: "ttm_affair_resolved"
      caseSensitive: false
    - fieldPath: "skipTrigger"
      operator: "equals"
      value: false

audience: "nearby_npcs"
response:
  type: "direct_narration"
  content: "Have {{originator}} and {{event_json.victim}} speak to each other to reflect how they just resolved the affair and where their relationship stands now."

enabled: true
interrupt: false
probability: 1
cooldownSeconds: 30
priority: 7
