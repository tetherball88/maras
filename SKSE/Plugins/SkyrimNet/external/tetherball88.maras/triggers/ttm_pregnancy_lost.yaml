name: "ttm_pregnancy_lost"
description: "Direct narration when a pregnancy is terminated, miscarried, or cancelled in MARAS"

eventCriteria:
  eventType: "ttm_event"
  schemaConditions:
    - fieldPath: "type"
      operator: "equals"
      value: "ttm_pregnancy_lost"
      caseSensitive: false
    - fieldPath: "skipTrigger"
      operator: "equals"
      value: false

audience: "nearby_npcs"
response:
  type: "direct_narration"
  content: "Have {{originator}} and any present partner react to the pregnancy loss in a way that fits their personalities and circumstances."

enabled: true
interrupt: false
probability: 1
cooldownSeconds: 30
priority: 5
