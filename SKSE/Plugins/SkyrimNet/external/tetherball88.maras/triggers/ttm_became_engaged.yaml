name: "ttm_became_engaged"
description: "Direct narration when a couple becomes engaged to be married in MARAS"

eventCriteria:
  eventType: "ttm_event"
  schemaConditions:
    - fieldPath: "type"
      operator: "equals"
      value: "ttm_marital_status_change"
      caseSensitive: false
    - fieldPath: "newStatus"
      operator: "equals"
      value: "engaged"
      caseSensitive: false
    - fieldPath: "skipTrigger"
      operator: "equals"
      value: false

audience: "nearby_npcs"
response:
  type: "direct_narration"
  content: "Have {{originator}} and their partner react to becoming engaged to be married in a way that fits their personalities and feelings for each other."

enabled: true
interrupt: false
probability: 1
cooldownSeconds: 30
priority: 7

