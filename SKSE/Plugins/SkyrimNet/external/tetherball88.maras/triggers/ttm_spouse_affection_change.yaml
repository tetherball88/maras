name: "ttm_spouse_affection_change"
description: "Direct narration when spouse affection status changes in MARAS"

eventCriteria:
  eventType: "ttm_event"
  schemaConditions:
    - fieldPath: "type"
      operator: "equals"
      value: "ttm_spouse_affection_change"
      caseSensitive: false
    - fieldPath: "skipTrigger"
      operator: "equals"
      value: false

audience: "nearby_npcs"
response:
  type: "direct_narration"
  content: "Have {{originator}} speak to their partner in a way that reflects how their affection has {{event_json.affectionDirection}} and that their relationship is now {{event_json.affectionLevel}}."

enabled: true
interrupt: false
probability: 1
cooldownSeconds: 60
priority: 4
