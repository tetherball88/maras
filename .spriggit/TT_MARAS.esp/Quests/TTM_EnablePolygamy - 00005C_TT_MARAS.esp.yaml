Name:
  TargetLanguage: English
  Value: The Flame Divides Not
Flags:
- RunOnce
- WarnOnAliasFillFailure
Priority: 50
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Since your bond at Mara's altar... something within you hums against it, not in defiance, but in expansion. As if one flame is not enough.
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Maramal recognized that my soul may not fit the bounds of ordinary rites. He spoke of old debates within the Temple and suggested I speak with the priestesses of Dibella, who hold broader views on love and union.
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Senna told me of an ancient scroll - the Scroll of Alessia's Grace - said to speak of divine souls capable of multiple sacred bonds. She believes it may still rest in the ruins of Ragnvald in the Reach. I'll need to search for it there.
- Index: 25
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I've found the scroll in Ragnvald, but the writing is old and unreadable. I should inspect it more closely before seeking help.
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I recovered the scroll from deep within Ragnvald, but I can't read the writing. The text is in an ancient language, unreadable to me. I should bring it back to Senna - maybe she can help.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Senna couldn't read the scroll - the language is older than anything she's seen. She recommended I take it to the College of Winterhold. Urag gro-Shub might be able to translate it.
- Index: 50
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Urag recognized the script as ancient Alessian and agreed to translate the scroll. He said it would take about a day. I should come back later and see what he's found.
- Index: 52
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Urag should have finished translating the scroll by now. I should return to him and see what he found.
- Index: 55
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Urag completed the translation. The scroll speaks of divine souls and their capacity to love and bind beyond mortal limitations. I should read it myself before returning to the Temple.
- Index: 60
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: The scroll speaks of divine souls - like mine - capable of loving and bonding without division. It describes a rite once offered to Alessia's line. I should return this to Maramal.
- Index: 70
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Maramal read the scroll and acknowledged its truth. He believes that, as Dragonborn, I may be granted a Divine Exception under Mara's light. But before he will bless this new path, I must speak to my current spouse - Mara's rites demand that love must not be imposed, but shared in truth.
- Index: 80
  Flags:
  - ShutDownStage
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I shared what I've learned with my spouse. They understand this is not a betrayal, but a blessing - and that my heart remains whole with them. With their trust and Mara's grace, I may now open my soul to others in sacred union.
